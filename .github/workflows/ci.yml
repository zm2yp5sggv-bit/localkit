name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # 每天跑一次。仓库代码没变，但 Cloudflare 控制台的设置可能被改动——
  # 缓存策略、Web Analytics、Pretty URLs 都没有版本控制，只有线上探测能发现。
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  check:
    name: 静态检查 (Node ${{ matrix.node }})
    # 定时任务只关心线上状态，跳过纯仓库检查以免每天白跑一遍
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 版本矩阵的作用不只是兼容性——Playwright 1.47.2 曾在 Node 24 下启动即挂起，
        # 而这类问题只有真的在多个 Node 版本上跑过才会暴露。
        # 不含 Node 20：它已于 2026-04-30 EOL，官方不再提供安全修复，
        # 且 node --test 的 glob 参数要 Node 21+ 才支持。
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: i18n 一致性（静态文案 / 字典 / 死键）
        run: node scripts/check-i18n.mjs

      - name: 语法、JSON-LD、资源引用与零外发检查
        run: node scripts/check-syntax.mjs

      - name: 部署配置（_headers 重复响应头 / _redirects 状态码与屏蔽覆盖率）
        run: node scripts/check-deploy.mjs

      - name: 第三方依赖完整性（比对 assets/vendor 的 sha256）
        run: node scripts/update-vendor.mjs --check

      # 裁判本身也要被检查：用「坏样本」验证上面几个脚本确实会报错，
      # 否则它们可能静默地给出虚假的「全部通过」。
      - name: 校验脚本自测（坏样本注入）
        run: npm run test:checks

  e2e:
    name: 端到端测试 (Node ${{ matrix.node }})
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: 安装 Chromium
        run: npx playwright install --with-deps chromium

      - name: 运行 Playwright
        run: npm test

      - name: 上传失败报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-node${{ matrix.node }}
          path: playwright-report/
          retention-days: 7

  smoke:
    name: 生产站点冒烟
    # 只有线上环境才有意义，因此 PR 不跑；push 与定时任务都跑
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 断言线上实际状态与仓库 _headers 的声明一致：缓存策略是否被
      # Cloudflare 的 Browser Cache TTL 覆盖、是否被注入第三方脚本、
      # 安全响应头是否真的下发。
      - name: 冒烟检查
        run: npm run smoke
